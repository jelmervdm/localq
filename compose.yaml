services:
  localq:
    image: ghcr.io/jelmervdm/localq:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: localqd
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "443:8443"
      - "8883:8883"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - localq-certs:/data/certs

volumes:
  localq-certs:
