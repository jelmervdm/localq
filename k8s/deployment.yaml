---
apiVersion: v1
kind: ConfigMap
metadata:
  name: localq-config
  labels:
    app.kubernetes.io/name: localq
data:
  LOCALQ_BIND_HOST: "0.0.0.0"
  LOCALQ_HTTPS_PORT: "8443"
  LOCALQ_MQTT_TLS_PORT: "8883"
  LOCALQ_PUBLIC_HOST: "common.iot.aic.lgthinq.com"
  LOCALQ_CERTS_DIR: "/data/certs"
  LOCALQ_LOG_LEVEL: "INFO"
  # Replace with your Home Assistant Mosquitto service DNS name or LAN IP
  HA_MQTT_HOST: "mosquitto.homeassistant.svc.cluster.local"
  HA_MQTT_PORT: "1883"
  HA_MQTT_DISCOVERY_PREFIX: "homeassistant"
  # Optional JSON mapping of appliance IPs or device IDs to roles ("washer" | "dryer")
  # Example: '{"192.0.2.20":"washer","192.0.2.21":"dryer"}'
  LOCALQ_KNOWN_APPLIANCES: '{}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localq
  labels:
    app.kubernetes.io/name: localq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localq
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: localqd
          image: ghcr.io/jelmervdm/localq:latest
          ports:
            - name: https-dispatch
              containerPort: 8443
              protocol: TCP
            - name: mqtt-tls
              containerPort: 8883
              protocol: TCP
          envFrom:
            - configMapRef:
                name: localq-config
            # Create a Secret named `localq-secrets` with HA_MQTT_USER and HA_MQTT_PASSWORD
            - secretRef:
                name: localq-secrets
                optional: true
          readinessProbe:
            tcpSocket:
              port: mqtt-tls
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: mqtt-tls
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: certs
              mountPath: /data/certs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: certs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: localq
  labels:
    app.kubernetes.io/name: localq
  # Optionally pin a static LoadBalancer IP or switch to NodePort/hostPort
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: localq
  ports:
    - name: https-dispatch
      port: 443
      targetPort: 8443
      protocol: TCP
    - name: mqtt-tls
      port: 8883
      targetPort: 8883
      protocol: TCP
