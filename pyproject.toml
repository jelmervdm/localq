[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spinq"
version = "0.1.0"
description = "Local smart-laundry cloud emulator and Home Assistant MQTT auto-discovery bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jelmer van der Meer" }]
keywords = ["home-assistant", "mqtt", "laundry", "iot", "local-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jelmervdm/spinq"
Repository = "https://github.com/jelmervdm/spinq"
Issues = "https://github.com/jelmervdm/spinq/issues"

[project.scripts]
spinqd = "spinq.server:main"
spinq-provision = "spinq.softap_provision:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
