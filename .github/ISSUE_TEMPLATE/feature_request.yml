name: Feature Request
description: Suggest an enhancement, appliance model support, or Home Assistant entity addition
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the feature or appliance capability you would like supported.
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Sample telemetry or protocol details (optional)
      description: If requesting support for a new appliance model or field, paste a sanitized sample payload.
      render: json
