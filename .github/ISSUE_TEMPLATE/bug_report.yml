name: Bug Report
description: Report a bug or unexpected behavior in spinq
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please avoid posting real passwords, tokens, or personal serial numbers.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can this behavior be reproduced?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Deployment method & version
      description: e.g., Docker Compose, Kubernetes, or local Python 3.12; image tag or commit SHA
      placeholder: "ghcr.io/jelmervdm/spinq:latest on Docker Compose"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (sanitized)
      description: Paste sanitized `spinqd` logs (with `SPINQ_LOG_LEVEL=DEBUG` if possible).
      render: text
